# FINAL MODEL CONFIGURATION - frozen BEFORE any official test-set contact (Phase 9)
# Selected on VALIDATION ENGINES ONLY in Phase 8 ablations (seed 42, 80/20 engine split).

model: xgboost
dataset: FD001
variant: w90_c45_all          # data/processed/FD001_w90_c45_all/
window: 90                    # sequence length (A-ablation winner)
max_rul: 45                   # RUL clipping cap (B-ablation winner); predictions clipped at this cap
sensors: all                  # D-ablation winner (all 21 channels)
loss: n/a                     # XGBoost uses its own objective; C-ablation (MSE) applies to deep models only
seed: 42

# Hyperparameters (identical to every Phase 5-8 xgboost run)
xgboost:
  n_estimators: 500
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  early_stopping_rounds: 30
  eval_set: validation engines only (never test)

# Pre-test validation metrics (for reproducibility check, NOT test metrics)
validation_metrics:
  rmse: 2.376
  mae: 1.258
  r2: 0.969
  nasa_score: 326.486

# Guardrails (label updated V2-12: "exactly once" no longer holds — see AUDIT_V2.md Issue 7)
test_usage: POST-HOC OFFICIAL TEST EVALUATION (historical config; first contact was at Phase 9, labels later re-inspected in V2 audits)
scaler_fit: TRAINING ENGINES ONLY (test never used for fitting or tuning)