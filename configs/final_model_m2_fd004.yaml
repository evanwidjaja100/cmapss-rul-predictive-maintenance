# Methodology M2 final model configuration - FD004 (source of truth for scripts/run_m2_fd004_freeze.py)
methodology: "m2"
dataset: "FD004"
task: "raw RUL regression under multiple operating regimes"

model:
  architecture: "gru"
  window: 45
  units: [128, 64]
  dropout: 0.3
  loss: "huber"
  learning_rate: 0.001
  batch_size: 256
  epochs: 60
  patience: 8
  seed: 42
  n_features: 21

preprocessing:
  variant: "C"
  regime_clustering: "KMeans(k=6) on (setting_1, setting_2, setting_3), n_init=10, random_state=42"
  regime_scaling: "per-regime StandardScaler on the 21 sensors, fit on development-training rows only"
  settings_used_for_clustering_only: true

splits:
  provenance: "experiments/splits/fd004_m1_seed42.json (M1 split: 175 dev / 37 val / 37 cal)"
  development_engine_count: 175
  validation_engine_count: 37
  calibration_engine_count: 37
  fractions: [0.25, 0.45, 0.65, 0.80, 0.95]
  validation_manifest: "experiments/splits/fd004_m2_validation_cutoffs.csv"

selection:
  candidates: 4
  results_csv: "experiments/m2/fd004_variant_results.csv"
  variant_results:
    A_global_scaler: {RMSE: 71.9264, R2: -0.2293, NASA_total: 2554269.56, prediction_std: 0.0}
    B_global_scaler_plus_settings: {RMSE: 72.1919, R2: -0.2384, NASA_total: 2679350.3, prediction_std: 0.0}
    C_regime_scalers: {RMSE: 29.3719, R2: 0.795, NASA_total: 46165.29, prediction_std: 69.7038}
    D_C_plus_settings_plus_onehot: {RMSE: 27.2231, R2: 0.8239, NASA_total: 68980.96, prediction_std: 68.1923}
  rationale: >
    A/B collapse to a constant (prediction_std 0.0) - the M1-11 negative result
    reproduced. C restores variance (pred_std 69.7), RMSE 71.9 -> 29.4, R2 -0.23 ->
    0.80, NASA 55x better. D improves RMSE/R2 further but NASA regresses 1.5x
    (68981 vs 46165); C selected on the deployment-critical NASA metric.

software:
  python: "3.12.6"
  tensorflow: "2.21.0"
  keras: "3.15.1"
  numpy: "2.5.2"
  pandas: "3.0.5"
  scikit_learn: "1.9.0"