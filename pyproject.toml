[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rul-prediction"
version = "0.1.0"
description = "Leakage-safe Remaining Useful Life prediction for predictive maintenance using NASA C-MAPSS"
requires-python = ">=3.11,<3.13"  # TensorFlow has no Windows wheels for 3.13; tested on 3.12.6
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "pyyaml",
    "joblib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "jupyterlab",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "needs_artifacts: requires gitignored data/model/experiment artifacts (excluded in CI)",
    "unit: fast, artifact-free unit tests (CI default)",
    "integration: multi-component tests needing no gitignored artifacts",
]