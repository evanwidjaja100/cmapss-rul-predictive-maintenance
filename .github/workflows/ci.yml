name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Run artifact-free unit tests
        run: python -m pytest -m "not needs_artifacts"
      - name: Report skipped (artifact-gated) tests
        run: python -m pytest -m needs_artifacts --collect-only -q | tail -5